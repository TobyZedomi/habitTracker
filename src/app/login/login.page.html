<ion-header>
  <ion-toolbar class="top-toolbar">
    <div class="header-container">
      <img src="assets/habittrackerlogo.avif" class="logo">
      <span class="title">Coach Habits</span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="login-wrapper">
    <div class="login-card">

      <h1 class="app-name">Coach Habits</h1>
      <p class="login-title" style="font-weight: bold;">Login to track your habits</p>

      <ion-item class="input-item">
        <ion-input
          [(ngModel)]="username"
          type="text"
          placeholder="Enter your username"
          autocomplete="off">
        </ion-input>
      </ion-item>

      <ion-item class="input-item">
        <ion-input
          [(ngModel)]="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="new-password">
        </ion-input>
      </ion-item>

      <ion-text color="danger" *ngIf="errorMessage">
        <p class="error-text">{{ errorMessage }}</p>
      </ion-text>

      <ion-button expand="block" class="login-btn" (click)="login()">
        LOGIN
      </ion-button>

      <ion-button expand="block" fill="clear" class="register-btn" (click)="goToRegister()">
        CREATE ACCOUNT
      </ion-button>

    </div>
  </div>
</ion-content>
